name: GeflechtEQ private unsigned IPA build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable lowercase 40-character source commit SHA
        required: true
        default: f6f1bd8d83420b1524e65f5b970109c67880a13a
        type: string

# The workflow does not need an ambient repository GITHUB_TOKEN, so no
# repository permission is granted.
permissions: {}

concurrency:
  group: geflechteq-private-ipa-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    name: private unsigned archive
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SOURCE_REPOSITORY: Nanoth-del/GeflechtEQ
      RELEASE_REPOSITORY: Nanoth-del/GeflechtEQ
      PROJECT_PATH: GeflechtEQ.xcodeproj
      SCHEME: GeflechtEQ
      APP_NAME: GeflechtEQ
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Validate immutable build request
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::An immutable lowercase source SHA is required."
            exit 1
          fi

          echo "Immutable build request accepted."

      - name: Checkout private source without publishing metadata
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_TOKEN: ${{ secrets.GEFLECHTEQ }}
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: "0"
        shell: bash
        run: |
          set -euo pipefail

          checkout_log="$RUNNER_TEMP/geflechteq-checkout.log"
          source_path="$GITHUB_WORKSPACE/private-source"

          if [[ -z "$SOURCE_TOKEN" ]]; then
            echo "::error::The protected source-read credential is not configured."
            exit 1
          fi

          echo "::add-mask::$SOURCE_TOKEN"
          auth_header="$(printf 'x-access-token:%s' "$SOURCE_TOKEN" | base64 | tr -d '\n')"

          rm -rf "$source_path"
          mkdir -p "$source_path"

          if ! git -C "$source_path" init -q >"$checkout_log" 2>&1; then
            echo "::error::Private source initialization failed. Detailed output was withheld."
            exit 1
          fi

          if ! git -C "$source_path" remote add origin \
            "https://github.com/$SOURCE_REPOSITORY.git" >>"$checkout_log" 2>&1; then
            echo "::error::Private source configuration failed. Detailed output was withheld."
            exit 1
          fi

          if ! git -C "$source_path" \
            -c "http.extraheader=AUTHORIZATION: basic $auth_header" \
            fetch --no-tags --prune --depth=1 origin "$SOURCE_REF" >>"$checkout_log" 2>&1 || \
             ! git -C "$source_path" checkout --detach --quiet FETCH_HEAD >>"$checkout_log" 2>&1; then
            echo "::error::Private source checkout failed. Detailed output was withheld."
            exit 1
          fi

          source_sha="$(git -C "$source_path" rev-parse HEAD)"
          if [[ "$source_sha" != "$SOURCE_REF" ]]; then
            echo "::error::Fetched source revision did not match the requested immutable SHA."
            exit 1
          fi

          unset SOURCE_TOKEN auth_header
          echo "Private source checkout succeeded."

      - name: Validate private project contract
        shell: bash
        run: |
          set -euo pipefail

          source_path="$GITHUB_WORKSPACE/private-source"
          shared_scheme="$source_path/$PROJECT_PATH/xcshareddata/xcschemes/$SCHEME.xcscheme"

          if [[ ! -d "$source_path/$PROJECT_PATH" ]] || [[ ! -f "$shared_scheme" ]]; then
            echo "::error::Required private project contract was not found."
            exit 1
          fi

          echo "Private project contract validated."

      - name: Validate Xcode toolchain privately
        shell: bash
        run: |
          set -euo pipefail

          toolchain_log="$RUNNER_TEMP/geflechteq-toolchain.log"

          if ! xcodebuild -version >"$toolchain_log" 2>&1; then
            echo "::error::Xcode toolchain validation failed. Detailed output was withheld."
            exit 1
          fi

          xcode_major="$(awk '/Xcode/{split($2, parts, "."); print parts[1]}' "$toolchain_log")"
          if [[ "${xcode_major:-0}" -lt 26 ]]; then
            echo "::error::Xcode 26 or newer is required."
            exit 1
          fi

          if ! swift --version >>"$toolchain_log" 2>&1; then
            echo "::error::Swift toolchain validation failed. Detailed output was withheld."
            exit 1
          fi

          echo "Toolchain validation succeeded."

      - name: Resolve Swift packages privately
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          resolve_log="$RUNNER_TEMP/geflechteq-resolve.log"
          if ! xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -resolvePackageDependencies \
            -skipMacroValidation \
            -skipPackagePluginValidation >"$resolve_log" 2>&1; then
            echo "::error::Swift package resolution failed. Detailed output was withheld."
            exit 1
          fi

          echo "Swift package resolution succeeded."

      - name: Clean Xcode project privately
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          clean_log="$RUNNER_TEMP/geflechteq-clean.log"
          derived_data="$RUNNER_TEMP/GeflechtEQ-DerivedData"
          if ! xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean >"$clean_log" 2>&1; then
            echo "::error::Xcode clean failed. Detailed output was withheld."
            exit 1
          fi

          echo "Xcode clean succeeded."

      - name: Build fresh unsigned archive privately
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          build_log="$RUNNER_TEMP/geflechteq-xcodebuild.log"
          archive_path="$RUNNER_TEMP/GeflechtEQ.xcarchive"
          derived_data="$RUNNER_TEMP/GeflechtEQ-DerivedData"

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Builder run number was not a positive integer."
            exit 1
          fi

          rm -rf "$archive_path"
          if ! xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$derived_data" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive >"$build_log" 2>&1; then
            # Keep the private build log on the runner, but expose only the
            # compiler's actionable error lines. Strip runner/source paths and
            # never print the full log or source excerpts into the public log.
            sanitized_diagnostics="$(grep -E '(^|[[:space:]])(fatal error:|error:)|SwiftCompile' "$build_log" \
              | sed -E 's#([^[:space:]]*/)?private-source/#<private-source>/#g' \
              | tail -n 40 || true)"
            if [[ -n "$sanitized_diagnostics" ]]; then
              while IFS= read -r diagnostic; do
                echo "::error::$diagnostic"
              done <<< "$sanitized_diagnostics"
            else
              echo "::error::No sanitized compiler diagnostic was available."
            fi
            echo "::error::iOS archive failed. Detailed compiler output was withheld."
            exit 1
          fi

          if [[ ! -d "$archive_path/Products/Applications/$APP_NAME.app" ]]; then
            echo "::error::The expected application bundle was not produced."
            exit 1
          fi

          echo "iOS archive succeeded."

      - name: Package unsigned IPA privately
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/GeflechtEQ.xcarchive/Products/Applications/$APP_NAME.app"
          ipa_root="$RUNNER_TEMP/geflechteq-ipa"
          ipa_path="$RUNNER_TEMP/${APP_NAME}-unsigned.ipa"

          if [[ ! -d "$app_path" ]]; then
            echo "::error::The archived app bundle was unavailable for packaging."
            exit 1
          fi

          rm -rf "$ipa_root"
          rm -f "$ipa_path"
          mkdir -p "$ipa_root/Payload"
          ditto "$app_path" "$ipa_root/Payload/$APP_NAME.app"
          (
            cd "$ipa_root"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"
          )

          if ! unzip -Z1 "$ipa_path" >"$RUNNER_TEMP/geflechteq-ipa-entries.log" 2>&1; then
            echo "::error::IPA packaging validation failed."
            exit 1
          fi

          echo "Unsigned IPA packaged successfully."

      - name: Audit unsigned IPA privately
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$RUNNER_TEMP/${APP_NAME}-unsigned.ipa"
          audit_root="$RUNNER_TEMP/geflechteq-ipa-audit"
          audit_log="$RUNNER_TEMP/geflechteq-ipa-audit.log"
          entries_log="$RUNNER_TEMP/geflechteq-ipa-entries.log"
          app_path="$audit_root/Payload/$APP_NAME.app"
          app_binary="$app_path/$APP_NAME"

          rm -rf "$audit_root"
          mkdir -p "$audit_root"
          if ! unzip -qq "$ipa_path" -d "$audit_root" >"$audit_log" 2>&1; then
            echo "::error::IPA privacy audit could not unpack the artifact."
            exit 1
          fi

          if [[ ! -d "$app_path" ]] || [[ ! -f "$app_path/Info.plist" ]] || [[ ! -f "$app_binary" ]]; then
            echo "::error::IPA privacy audit found an invalid application layout."
            exit 1
          fi

          if [[ -e "$app_path/_CodeSignature" ]] || [[ -e "$app_path/embedded.mobileprovision" ]]; then
            echo "::error::IPA privacy audit found signing material in an unsigned build."
            exit 1
          fi

          if find "$audit_root" \( \
            -type f -name '*.swift' -o \
            -type d \( -name '*.dSYM' -o -name '*.xcarchive' -o -name '*.xcresult' \) \
          \) -print -quit | grep -q .; then
            echo "::error::IPA privacy audit found source or build products."
            exit 1
          fi

          if grep -E -q '(^|/)(\.git|\.DS_Store|__MACOSX|DerivedData)(/|$)' "$entries_log"; then
            echo "::error::IPA privacy audit found disallowed archive metadata."
            exit 1
          fi

          if ! plutil -lint "$app_path/Info.plist" >>"$audit_log" 2>&1; then
            echo "::error::IPA privacy audit found an invalid bundle metadata file."
            exit 1
          fi

          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")"
          bundle_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")"
          if [[ ! "$bundle_version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || [[ "$bundle_build" != "$BUILD_NUMBER" ]]; then
            echo "::error::IPA bundle version metadata did not match this Builder run."
            exit 1
          fi

          if ! otool -l "$app_binary" >>"$audit_log" 2>&1; then
            echo "::error::IPA privacy audit could not inspect the application binary."
            exit 1
          fi

          if grep -q 'LC_CODE_SIGNATURE' "$audit_log"; then
            echo "::error::IPA privacy audit found a code-signature load command."
            exit 1
          fi

          if LC_ALL=C grep -R -a -E -q \
            'AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |DSA |PRIVATE )?PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]+|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{20,}|/Users/|/home/runner/|private-source|Geflecht-builder|Nanoth-del/' \
            "$audit_root"; then
            echo "::error::IPA privacy audit found a forbidden metadata or credential pattern."
            exit 1
          fi

          if ! shasum -a 256 "$ipa_path" >"$RUNNER_TEMP/geflechteq-ipa.sha256" 2>&1; then
            echo "::error::IPA digest generation failed."
            exit 1
          fi

          echo "Unsigned IPA privacy audit succeeded: version $bundle_version ($bundle_build)."

      - name: Publish and verify private Release asset
        env:
          RELEASE_TOKEN: ${{ secrets.GEFLECHTEQ }}
        shell: bash
        run: |
          set -euo pipefail

          ipa_path="$RUNNER_TEMP/${APP_NAME}-unsigned.ipa"
          digest_file="$RUNNER_TEMP/geflechteq-ipa.sha256"
          release_log="$RUNNER_TEMP/geflechteq-release.log"
          verify_dir="$RUNNER_TEMP/geflechteq-release-verify"
          source_sha="$(git -C "$GITHUB_WORKSPACE/private-source" rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          release_tag="private-build-${GITHUB_RUN_NUMBER}-${short_sha}"

          if [[ -z "$RELEASE_TOKEN" ]]; then
            echo "::error::The protected Release-write credential is not configured."
            exit 1
          fi

          echo "::add-mask::$RELEASE_TOKEN"
          if ! GH_TOKEN="$RELEASE_TOKEN" gh release create "$release_tag" \
            "$ipa_path" \
            --repo "$RELEASE_REPOSITORY" \
            --target "$source_sha" \
            --title "$APP_NAME $release_tag" \
            --notes "Unsigned iOS IPA. Build ${BUILD_NUMBER}. Re-sign before installation on a physical iPhone." \
            --prerelease >"$release_log" 2>&1; then
            echo "::error::Private Release publication failed. Detailed output was withheld."
            exit 1
          fi

          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          if ! GH_TOKEN="$RELEASE_TOKEN" gh release download "$release_tag" \
            --repo "$RELEASE_REPOSITORY" \
            --pattern "${APP_NAME}-unsigned.ipa" \
            --dir "$verify_dir" >>"$release_log" 2>&1; then
            echo "::error::Private Release asset verification download failed."
            exit 1
          fi

          expected_digest="$(awk '{print $1}' "$digest_file")"
          actual_digest="$(shasum -a 256 "$verify_dir/${APP_NAME}-unsigned.ipa" | awk '{print $1}')"
          if [[ ! "$expected_digest" =~ ^[0-9a-f]{64}$ ]] || [[ "$expected_digest" != "$actual_digest" ]]; then
            echo "::error::Private Release asset digest verification failed."
            exit 1
          fi

          unset RELEASE_TOKEN
          echo "Private Release asset published and verified."

      - name: Remove private source and all build products
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$RUNNER_TEMP/GeflechtEQ.xcarchive"
          rm -rf "$RUNNER_TEMP/GeflechtEQ-DerivedData"
          rm -rf "$RUNNER_TEMP/geflechteq-ipa"
          rm -rf "$RUNNER_TEMP/geflechteq-ipa-audit"
          rm -rf "$RUNNER_TEMP/geflechteq-release-verify"
          rm -f "$RUNNER_TEMP/GeflechtEQ-unsigned.ipa"
          rm -f "$RUNNER_TEMP"/geflechteq-*.log
          rm -f "$RUNNER_TEMP"/geflechteq-ipa.sha256
